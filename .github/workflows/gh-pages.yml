name: Deploy Hexo Blog

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 提前适配 Node.js 24，消除旧版 Node 20 警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install and Build 🔧
        run: |
          npm install
          rm -rf themes/warmpaper themes/landscape
          git clone --depth 1 https://github.com/finch-xu/hexo-theme-warmpaper.git themes/warmpaper
          
          # 👇 关键：用根目录的配置直接覆盖主题默认配置，防止英文菜单合并
          cp _config.warmpaper.yml themes/warmpaper/_config.yml
          rm _config.warmpaper.yml
          
          npm run build
          touch public/.nojekyll
        env:
          CI: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
